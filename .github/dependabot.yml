# Dependabot opens a pull request when something below has a newer version.
# Those pull requests run tests.yml, so you can see whether an update is safe.
version: 2
updates:
  # Python packages in requirements.txt
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Base image in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
