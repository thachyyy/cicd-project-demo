# CD pipeline: on every push to the main branch, run the tests and then
# publish a Docker image to GitHub Container Registry (ghcr.io).
name: Build and Publish

on:
  push:
    branches: [ main, master ]

jobs:
  # Reuse tests.yml instead of copying its steps here.
  test:
    uses: ./.github/workflows/tests.yml

  publish:
    # "needs" is the gate: no image is published unless the tests pass.
    needs: test
    runs-on: ubuntu-latest

    # Give the built-in GITHUB_TOKEN only the access this job needs.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN is created by GitHub for each run, so no secret needs to be added.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag each image with its commit SHA, and with "latest" on the default branch.
      - name: Work out image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
