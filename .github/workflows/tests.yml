# CI pipeline: checks formatting and runs the tests.
name: Tests

on:
  # Check every pull request before it is merged.
  pull_request:
    branches: [ main, master ]
  # Let other workflows run this one. docker.yml uses it on each push.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    # A temporary PostgreSQL database that exists only during this job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_demo_user
          # Trust mode needs no password, so no credential is stored here.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ci_demo
        ports: [ '5432:5432' ]
        # Wait until the database is ready before starting the steps.
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://ci_demo_user@localhost:5432/ci_demo

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # Reuse downloaded packages between runs to make the job faster.
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check formatting
        run: python -m black --check .

      - name: Run unit tests
        run: python -m pytest tests/test_articles.py

      - name: Run integration tests
        run: python -m pytest tests/test_integration.py
